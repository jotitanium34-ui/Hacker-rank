name: Sync Submissions

on:
  schedule:
    # Runs automatically every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to manually trigger the sync anytime

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Sync Action
        uses: joshcai/Hackerank-sync@v1.7.0
        with:
          github-token: ${{ secrets.GH_PAT }}
          hackerank-csrf-token: ${{ secrets.HACKERANK_CSRF_TOKEN }}
          hackerank-session: ${{ secrets.HACKERANK_SESSION }}
