name: Sync HackerRank Submissions

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run HackerRank Sync Script
        env:
          HACKERRANK_USERNAME: ${{ secrets.HACKERRANK_USERNAME }}
          HACKERRANK_PASSWORD: ${{ secrets.HACKERRANK_PASSWORD }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - << 'EOF'
          import os
          import requests

          username = os.environ.get("HACKERRANK_USERNAME")
          repo = os.environ.get("GITHUB_REPOSITORY")

          print(f"Starting sync setup for HackerRank user: {username}")
          print(f"Target repository: {repo}")
          print("Workflow environment configuration is complete.")
          EOF
