name: Sync HackerRank Submissions

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y firefox
          pip install --upgrade pip
          # Install your sync package or Apparate here if hosted, 
          # or execute your custom sync script

      - name: Run Sync Script
        env:
          HACKERRANK_USERNAME: ${{ secrets.HACKERRANK_USERNAME }}
          HACKERRANK_PASSWORD: ${{ secrets.HACKERRANK_PASSWORD }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          echo "Add your sync commands here"
